<rect x="810" y="486" width="330" height="92" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/><text x="825" y="513" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="17" font-weight="700" fill="#1f2733">Management account</text><text x="825" y="537" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" xml:space="preserve">SCPs do not apply:</text><text x="825" y="559" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" xml:space="preserve">never run workloads here</text>
