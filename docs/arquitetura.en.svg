<rect x="36" y="556" width="270" height="64" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="51" y="583" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="17" font-weight="700" fill="#c0392b">RunInstances with IMDSv1</text><text x="51" y="607" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" xml:space="preserve">or hop limit above 2</text>
<rect x="380" y="52" width="380" height="400" rx="6" fill="#ffffff" stroke="#2f5fd0" stroke-width="2"/><text x="395" y="79" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="17" font-weight="700" fill="#1f2733">OU SCPs (deny list)</text><text x="395" y="103" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" xml:space="preserve">evaluated before the IAM policy</text><text x="395" y="148" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" font-weight="600" fill="#2f5fd0">1</text><text x="415" y="148" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" fill="#1f2733">IP from Brazil or US</text><text x="415" y="169" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="13.5" fill="#4b5563">aws:SourceIp · 270 /13 blocks (LACNIC + ARIN)</text><text x="745" y="148" text-anchor="end" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#2f7d4a">allows</text><text x="395" y="238" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" font-weight="600" fill="#2f5fd0">2</text><text x="415" y="238" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" fill="#1f2733">AWS service call</text><text x="415" y="259" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="13.5" fill="#4b5563">aws:ViaAWSService = true</text><text x="745" y="238" text-anchor="end" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#2f7d4a">allows</text><text x="395" y="328" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" font-weight="600" fill="#2f5fd0">3</text><text x="415" y="328" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" fill="#1f2733">came through VPC Endpoint</text><text x="415" y="349" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="13.5" fill="#4b5563">aws:SourceVpce = vpce-*</text><text x="745" y="328" text-anchor="end" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#2f7d4a">allows</text><text x="395" y="418" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" font-weight="600" fill="#2f5fd0">4</text><text x="415" y="418" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" fill="#1f2733">IMDSv2 and hop limit up to 2</text><text x="415" y="439" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="13.5" fill="#4b5563">MetadataHttpTokens = required</text><text x="745" y="418" text-anchor="end" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#2f7d4a">allows</text>
<rect x="380" y="470" width="380" height="136" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="395" y="497" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="17" font-weight="700" fill="#c0392b">Explicit Deny (AccessDenied)</text><text x="395" y="521" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" xml:space="preserve">beats any Allow,</text><text x="395" y="543" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" xml:space="preserve">including the account admin and root</text>
<rect x="810" y="182" width="330" height="92" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="825" y="209" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="17" font-weight="700" fill="#1f2733">Account IAM policy</text><text x="825" y="233" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" xml:space="preserve">only now decides what</text><text x="825" y="255" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" xml:space="preserve">each person can do</text>
