<rect x="36" y="108" width="270" height="70" rx="6" fill="#ffffff" stroke="#2f5fd0" stroke-width="2"/><text x="51" y="135" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="17" font-weight="700" fill="#1f2733">Person in Brazil or US</text><text x="51" y="159" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14.5" font-weight="400" fill="#4b5563" xml:space="preserve">console or CLI</text>
<rect x="36" y="198" width="270" height="70" rx="6" fill="#ffffff" stroke="#2f5fd0" stroke-width="2"/><text x="51" y="225" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="17" font-weight="700" fill="#1f2733">Lambda → DynamoDB</text><text x="51" y="249" font-family="'IBM Plex Mono', 'JetBrains Mono', monospace" font-size="14.5" font-weight="400" fill="#374151" xml:space="preserve">aws:ViaAWSService</text>
<rect x="36" y="288" width="270" height="70" rx="6" fill="#ffffff" stroke="#2f5fd0" stroke-width="2"/><text x="51" y="315" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="17" font-weight="700" fill="#1f2733">App via VPC Endpoint</text><text x="51" y="339" font-family="'IBM Plex Mono', 'JetBrains Mono', monospace" font-size="14.5" font-weight="400" fill="#374151" xml:space="preserve">aws:SourceVpce vpce-*</text>
