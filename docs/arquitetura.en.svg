lex Sans', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#2f7d4a">allows</text><text x="395" y="358" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" font-weight="600" fill="#2f5fd0">4</text><text x="415" y="358" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" fill="#1f2733">Required tags</text><text x="415" y="379" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="13.5" fill="#4b5563">owner · cost-center · environment</text><text x="745" y="358" text-anchor="end" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#2f7d4a">allows</text><text x="395" y="428" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" font-weight="600" fill="#2f5fd0">5</text><text x="415" y="428" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" fill="#1f2733">IMDSv2, hop limit up to 2</text><text x="415" y="449" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="13.5" fill="#4b5563">MetadataHttpTokens = required</text><text x="745" y="428" text-anchor="end" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#2f7d4a">allows</text><text x="395" y="498" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" font-weight="600" fill="#2f5fd0">6</text><text x="415" y="498" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" fill="#1f2733">IP from Brazil or US</text><text x="415" y="519" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="13.5" fill="#4b5563">270 /13 blocks · or VPC endpoint</text><text x="745" y="498" text-anchor="end" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#2f7d4a">allows</text>
