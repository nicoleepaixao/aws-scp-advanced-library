IBM Plex Sans', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#2f7d4a">libera</text><text x="395" y="418" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" font-weight="600" fill="#2f5fd0">4</text><text x="415" y="418" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="15" fill="#1f2733">IMDSv2 e hop limit até 2</text><text x="415" y="439" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="13.5" fill="#4b5563">MetadataHttpTokens = required</text><text x="745" y="418" text-anchor="end" font-family="'IBM Plex Sans', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#2f7d4a">libera</text>
